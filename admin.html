<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>S-MART Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f6f7f9;
  color:#172033;
}

.header{
  background:#172033;
  color:white;
  padding:22px;
  text-align:center;
}

.container{
  max-width:650px;
  margin:30px auto;
  padding:0 18px;
}

.panel{
  background:white;
  padding:25px;
  border-radius:22px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

label{
  display:block;
  font-weight:700;
  margin:16px 0 7px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
}

button{
  width:100%;
  margin-top:22px;
  padding:15px;
  border:0;
  border-radius:30px;
  background:#d4145a;
  color:white;
  font-size:16px;
  font-weight:800;
}

.delete-btn{
  background:#172033;
  margin-top:12px;
}

#message{
  text-align:center;
  margin-top:18px;
  font-weight:700;
}

.product{
  margin-top:20px;
  padding:15px;
  background:#fafafa;
  border-radius:18px;
}

.product img{
  width:100%;
  height:250px;
  object-fit:contain;
  background:white;
  border-radius:14px;
}

.product h3{
  margin-top:12px;
}

.price{
  color:#d4145a;
  font-size:20px;
  font-weight:900;
  margin-top:5px;
}

#preview{
  display:none;
  width:100%;
  max-height:250px;
  object-fit:contain;
  margin-top:15px;
  border-radius:15px;
  background:#f5f5f5;
}
</style>
</head>

<body>

<div class="header">
  <h1>S-MART</h1>
  <p>Admin Panel</p>
</div>

<div class="container">
<div class="panel">

<h2>Add Product</h2>

<label>Product Name</label>

<input
id="productName"
type="text"
placeholder="Example: Mangalsutra Set">


<label>Price</label>

<input
id="price"
type="number"
placeholder="Example: 700">


<label>Select Product Photo</label>

<input
id="photoFile"
type="file"
accept="image/*"
onchange="previewPhoto(event)">

<img id="preview">


<button onclick="addProduct()">
+ Add Product
</button>

<p id="message"></p>

<hr style="margin:30px 0;border:0;border-top:1px solid #eee;">

<h2>Added Products</h2>

<div id="productList">
Loading...
</div>

</div>
</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyAzERvRj7VLhwKYqvFgRotPXKW-xpDZMo0",

authDomain:
"fir-mart-collection.firebaseapp.com",

projectId:
"fir-mart-collection",

storageBucket:
"fir-mart-collection.firebasestorage.app",

messagingSenderId:
"1028424910999",

appId:
"1:1028424910999:web:99b8df0caa825eb49901d2",

measurementId:
"G-Y148CMCW04"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* CLOUDINARY SETTINGS */

const CLOUD_NAME = "lnnzd0sj";

const UPLOAD_PRESET = "smart_upload";


/* PHOTO PREVIEW */

window.previewPhoto = function(event){

const file = event.target.files[0];

const preview = document.getElementById("preview");

if(file){

preview.src = URL.createObjectURL(file);

preview.style.display = "block";

}

};


/* ADD PRODUCT */

window.addProduct = async function(){

const name =
document.getElementById("productName").value.trim();

const price =
document.getElementById("price").value;

const file =
document.getElementById("photoFile").files[0];

const message =
document.getElementById("message");


if(!name || !price || !file){

message.innerText =
"Please enter name, price and select photo.";

return;

}


try{

message.innerText =
"Uploading photo...";


/* UPLOAD TO CLOUDINARY */

const formData = new FormData();

formData.append("file", file);

formData.append(
"upload_preset",
UPLOAD_PRESET
);


const response = await fetch(
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
{
method:"POST",
body:formData
}
);


const data = await response.json();


if(!data.secure_url){

console.log(data);

throw new Error("Cloudinary upload failed");

}


const photoUrl =
data.secure_url;


/* SAVE PRODUCT TO FIREBASE */

message.innerText =
"Saving product...";


await addDoc(
collection(db,"products"),
{
Name:name,
Price:Number(price),
photoUrl:photoUrl
}
);


message.innerText =
"✅ Product added successfully!";


document.getElementById("productName").value = "";

document.getElementById("price").value = "";

document.getElementById("photoFile").value = "";

document.getElementById("preview").style.display = "none";


showProducts();

}
catch(error){

console.error(error);

message.innerText =
"❌ " + error.message;

}

};


/* SHOW PRODUCTS */

async function showProducts(){

const productList =
document.getElementById("productList");

productList.innerHTML =
"Loading...";


const snapshot =
await getDocs(collection(db,"products"));


productList.innerHTML = "";


snapshot.forEach((item)=>{

const data = item.data();


const div =
document.createElement("div");

div.className = "product";


div.innerHTML = `

<img src="${data.photoUrl || ""}">

<h3>${data.Name || "Product"}</h3>

<div class="price">
₹${data.Price || 0}
</div>

<button
class="delete-btn"
onclick="deleteProduct('${item.id}')">
Delete Product
</button>

`;


productList.appendChild(div);

});

}


/* DELETE PRODUCT */

window.deleteProduct = async function(id){

const confirmDelete =
confirm("Delete this product?");


if(!confirmDelete) return;


try{

await deleteDoc(
doc(db,"products",id)
);


document.getElementById("message").innerText =
"Product deleted.";

showProducts();

}
catch(error){

console.error(error);

document.getElementById("message").innerText =
"Delete failed.";

}

};


showProducts();

</script>

</body>
</html>
