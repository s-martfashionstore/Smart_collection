<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>S-MART Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#f6f7f9;
  color:#172033;
}

.header{
  background:#172033;
  color:white;
  padding:22px;
  text-align:center;
}

.header h1{
  color:white;
}

.container{
  max-width:650px;
  margin:30px auto;
  padding:0 18px;
}

.panel{
  background:white;
  padding:25px;
  border-radius:22px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

label{
  display:block;
  font-weight:700;
  margin:16px 0 7px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
}

button{
  width:100%;
  margin-top:22px;
  padding:15px;
  border:0;
  border-radius:30px;
  background:#d4145a;
  color:white;
  font-size:16px;
  font-weight:800;
}

#message{
  text-align:center;
  margin-top:18px;
  font-weight:700;
}

.product{
  margin-top:20px;
  padding:15px;
  background:#fafafa;
  border-radius:18px;
}

.product img{
  width:100%;
  height:250px;
  object-fit:contain;
  background:white;
  border-radius:14px;
}

.product h3{
  margin-top:12px;
}

.price{
  color:#d4145a;
  font-size:20px;
  font-weight:900;
  margin-top:5px;
}
</style>
</head>

<body>

<div class="header">
  <h1>S-MART</h1>
  <p>Admin Panel</p>
</div>

<div class="container">

<div class="panel">

<h2>Add Product</h2>

<label>Product Name</label>
<input
  id="productName"
  type="text"
  placeholder="Example: Jewellery Set">

<label>Price</label>
<input
  id="price"
  type="number"
  placeholder="Example: 700">

<label>Photo URL</label>
<input
  id="photoUrl"
  type="url"
  placeholder="Paste Cloudinary photo URL">

<button onclick="addProduct()">
  + Add Product
</button>

<p id="message"></p>

<hr style="margin:30px 0;border:0;border-top:1px solid #eee;">

<h2>Added Products</h2>

<div id="productList"></div>

</div>
</div>

<script>

function addProduct(){

  const name =
    document.getElementById("productName").value.trim();

  const price =
    document.getElementById("price").value.trim();

  const photoUrl =
    document.getElementById("photoUrl").value.trim();

  if(!name || !price || !photoUrl){

    document.getElementById("message").innerText =
      "Please fill Product Name, Price and Photo URL.";

    return;
  }

  let products =
    JSON.parse(localStorage.getItem("smartProducts") || "[]");

  products.push({
    name:name,
    price:price,
    photoUrl:photoUrl
  });

  localStorage.setItem(
    "smartProducts",
    JSON.stringify(products)
  );

  document.getElementById("message").innerText =
    "Product added successfully!";

  document.getElementById("productName").value = "";
  document.getElementById("price").value = "";
  document.getElementById("photoUrl").value = "";

  showProducts();
}


function showProducts(){

  const list =
    document.getElementById("productList");

  const products =
    JSON.parse(localStorage.getItem("smartProducts") || "[]");

  list.innerHTML = "";

  products.forEach(function(product){

    list.innerHTML += `
      <div class="product">

        <img src="${product.photoUrl}"
             alt="${product.name}">

        <h3>${product.name}</h3>

        <div class="price">
          ₹${product.price}
        </div>

      </div>
    `;

  });
}

showProducts();

</script>

</body>
</html>
