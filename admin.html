<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>S-MART Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f6f7f9;
  color:#172033;
}

.header{
  background:#172033;
  color:white;
  padding:22px;
  text-align:center;
}

.container{
  max-width:650px;
  margin:30px auto;
  padding:0 18px;
}

.panel{
  background:white;
  padding:25px;
  border-radius:22px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

label{
  display:block;
  font-weight:700;
  margin:16px 0 7px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
}

button{
  width:100%;
  margin-top:22px;
  padding:15px;
  border:0;
  border-radius:30px;
  background:#d4145a;
  color:white;
  font-size:16px;
  font-weight:800;
}

.delete-btn{
  background:#172033;
  margin-top:12px;
}

#message{
  text-align:center;
  margin-top:18px;
  font-weight:700;
}

.product{
  margin-top:20px;
  padding:15px;
  background:#fafafa;
  border-radius:18px;
}

.product img{
  width:100%;
  height:250px;
  object-fit:contain;
  background:white;
  border-radius:14px;
}

.product h3{
  margin-top:12px;
}

.price{
  color:#d4145a;
  font-size:20px;
  font-weight:900;
  margin-top:5px;
}
</style>
</head>

<body>

<div class="header">
  <h1>S-MART</h1>
  <p>Admin Panel</p>
</div>

<div class="container">
<div class="panel">

<h2>Add Product</h2>

<label>Product Name</label>

<input
id="productName"
type="text"
placeholder="Example: Jewellery Set">


<label>Price</label>

<input
id="price"
type="number"
placeholder="Example: 700">


<label>Photo URL</label>

<input
id="photoUrl"
type="url"
placeholder="Paste Cloudinary photo URL">


<button onclick="addProduct()">
+ Add Product
</button>

<p id="message"></p>

<hr style="margin:30px 0;border:0;border-top:1px solid #eee;">

<h2>Added Products</h2>

<div id="productList">
Loading...
</div>

</div>
</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyAzERvRj7VLhwKYqvFgRotPXKW-xpDZMo0",

authDomain:
"fir-mart-collection.firebaseapp.com",

projectId:
"fir-mart-collection",

storageBucket:
"fir-mart-collection.firebasestorage.app",

messagingSenderId:
"1028424910999",

appId:
"1:1028424910999:web:99b8df0caa825eb49901d2",

measurementId:
"G-Y148CMCW04"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


window.addProduct = async function(){

const name =
document.getElementById("productName").value.trim();

const price =
document.getElementById("price").value.trim();

const photoUrl =
document.getElementById("photoUrl").value.trim();


if(!name || !price || !photoUrl){

document.getElementById("message").innerText =
"Please fill all fields.";

return;

}


try{

await addDoc(
collection(db,"products"),
{

Name:name,

Price:Number(price),

photoUrl:photoUrl

}
);


document.getElementById("message").innerText =
"Product added successfully!";


document.getElementById("productName").value = "";

document.getElementById("price").value = "";

document.getElementById("photoUrl").value = "";


showProducts();

}

catch(error){

console.error(error);

document.getElementById("message").innerText =
"Error: " + error.message;

}

};


window.deleteProduct = async function(id){

const confirmDelete =
confirm("Delete this product?");


if(!confirmDelete){
return;
}


try{

await deleteDoc(
doc(db,"products",id)
);


document.getElementById("message").innerText =
"Product deleted successfully!";


showProducts();

}

catch(error){

console.error(error);

document.getElementById("message").innerText =
"Delete error: " + error.message;

}

};


async function showProducts(){

const list =
document.getElementById("productList");

list.innerHTML =
"Loading...";


try{

const snapshot =
await getDocs(
collection(db,"products")
);


list.innerHTML = "";


if(snapshot.empty){

list.innerHTML =
"<p>No products yet.</p>";

return;

}


snapshot.forEach(function(item){

const product =
item.data();


const name =
product.Name || "Product";

const price =
product.Price || 0;

const photo =
product.photoUrl || "";


list.innerHTML += `

<div class="product">

<img
src="${photo}"
alt="${name}">

<h3>
${name}
</h3>

<div class="price">
₹${price}
</div>

<button
class="delete-btn"
onclick="deleteProduct('${item.id}')">

Delete Product

</button>

</div>

`;

});

}

catch(error){

console.error(error);

list.innerHTML =
"Could not load products.";

}

}


showProducts();

</script>

</body>
</html>
